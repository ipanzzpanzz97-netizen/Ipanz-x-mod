name: Build iPanz Mod X7 Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipanz-apk:
    name: Build iPanz_Mod_X7Pro.apk (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android 36.1 SDK, NDK r27c & CMake 3.22.1
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root tidak ditemui pada $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemui di bawah $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "Using SDK_ROOT=$SDK_ROOT"
          echo "Using SDKMANAGER=$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          # Elakkan SIGPIPE exit 141 apabila 'yes' disambungkan ke sdkmanager dengan pipefail aktif
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare AI Voice ONNX Model Pack (~58 MB FP16)
        run: |
          python3 scripts/prepare_ai_models.py --output-dir app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Prepare Debug & Release Signing Keystores
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            AUTO_PASS="ipanzX7ProRodin2026"
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass "$AUTO_PASS" -alias upload -keypass "$AUTO_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=iPanz Mod,O=POCO X7 Pro Suite,C=MY"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --tests "com.ipanz.mod.x7pro.*" --tests "com.example.ExampleUnitTest" --no-daemon --stacktrace

      - name: Compile Debug & Release APKs (Native C++ arm64-v8a)
        run: |
          gradle :app:assembleDebug :app:assembleRelease -PforceNativeBuild=true --no-daemon --stacktrace

      - name: Package & Verify iPanz_Mod_X7Pro.apk Size (70 MB - 95 MB)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/iPanz_Mod_X7Pro.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/iPanz_Mod_X7Pro_Debug.apk

          ls -lh dist/
          SIZE_BYTES=$(stat -c%s dist/iPanz_Mod_X7Pro.apk)
          SIZE_MB=$(python3 -c "print(f'{${SIZE_BYTES} / (1024 * 1024):.2f}')")
          echo "iPanz_Mod_X7Pro.apk size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"

          # Verify native arm64-v8a libraries & ONNX models exist inside Release APK
          unzip -l dist/iPanz_Mod_X7Pro.apk | grep -q "lib/arm64-v8a/libipanz_audio.so"
          unzip -l dist/iPanz_Mod_X7Pro.apk | grep -q "lib/arm64-v8a/liboboe.so"
          unzip -l dist/iPanz_Mod_X7Pro.apk | grep -q "lib/arm64-v8a/libonnxruntime.so"
          unzip -l dist/iPanz_Mod_X7Pro.apk | grep -q "assets/models/ipanz_voice_anime_fp16.onnx"

          # Verify target range: 70 MB (73400320 bytes) to 95 MB (99614720 bytes)
          if [ "$SIZE_BYTES" -lt 73400320 ] || [ "$SIZE_BYTES" -gt 99614720 ]; then
            echo "ERROR: APK size ${SIZE_MB} MB is outside 70 MB - 95 MB target!"
            exit 1
          fi

      - name: Upload iPanz Mod APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPanz-Mod-POCO-X7-Pro-APKs
          path: dist/*.apk
          retention-days: 30
